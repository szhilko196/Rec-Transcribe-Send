version: '3.8'

services:
  # RAGFlow main application
  ragflow:
    image: infiniflow/ragflow:latest
    container_name: ragflow
    ports:
      - "9380:80"    # Web UI (nginx)
      - "9381:9381"  # Admin API
    volumes:
      - ./ragflow_data:/ragflow/data
      - ./ragflow_logs:/ragflow/logs
      - C:/YandexDisk/DIASOFT/VideoPars/data:/ragflow/upload  # Meeting files access
      # Nginx configuration
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=Europe/Moscow
      # MySQL connection
      - MYSQL_PASSWORD=infiniflow
      # Redis connection
      - REDIS_PASSWORD=infiniflow
      # Document engine: use Elasticsearch (not Infinity)
      - DOC_ENGINE=elasticsearch
      # Embedding model
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_DEVICE=cpu  # Change to 'cuda' if GPU available
      # Reranker model
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      # LLM configuration
      - LLM_PROVIDER=claude
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=claude-sonnet-4-5-20250929
    depends_on:
      - ragflow-mysql
      - ragflow-redis
      - ragflow-es
      - infinity
    restart: unless-stopped
    networks:
      - ragflow-net

  # MySQL database (RAGFlow metadata storage)
  ragflow-mysql:
    image: mysql:8.0
    container_name: ragflow-mysql
    hostname: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=infiniflow
      - MYSQL_DATABASE=rag_flow
      - MYSQL_USER=ragflow
      - MYSQL_PASSWORD=infiniflow
      - TZ=Europe/Moscow
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      ragflow-net:
        aliases:
          - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pinfiniflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (RAGFlow caching)
  ragflow-redis:
    image: redis:7-alpine
    container_name: ragflow-redis
    hostname: redis
    command: redis-server --requirepass infiniflow
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    networks:
      ragflow-net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Elasticsearch (RAGFlow document indexing and search)
  ragflow-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ragflow-es
    hostname: es01
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - TZ=Europe/Moscow
    volumes:
      - ./es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - ragflow-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Infinity vector database (RAGFlow's vector engine)
  infinity:
    image: infiniflow/infinity:v0.6.15
    container_name: ragflow-infinity
    ports:
      - "23817:23817"  # Thrift
      - "23820:23820"  # HTTP
      - "5432:5432"    # PostgreSQL
    volumes:
      - ./infinity_data:/var/infinity
    restart: unless-stopped
    networks:
      ragflow-net:
        aliases:
          - infinity
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:23820/admin/node/current || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  ragflow-net:
    driver: bridge

# Volume definitions for persistence
volumes:
  ragflow_data:
  ragflow_logs:
  mysql_data:
  redis_data:
  es_data:
  infinity_data:
