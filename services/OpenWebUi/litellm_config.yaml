model_list:
  # =====================================================
  # Direct Anthropic API Models
  # =====================================================

  # Claude Sonnet 3.5 - Direct Anthropic API
  - model_name: claude-sonnet-3.5
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  # Claude Haiku 3.5 - Direct Anthropic API
  - model_name: claude-haiku-3.5
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  # =====================================================
  # OpenRouter Models (requires openrouter.ai account)
  # =====================================================

  # Free model via OpenRouter
  - model_name: gpt-oss-120b-free
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096

general_settings:
  master_key: sk-litellm-master-key

litellm_settings:
  drop_params: true  # Drop unsupported params for compatibility
  success_callback: []
  failure_callback: []
